name: Trout Island Watcher

on:
  schedule:
    # 15分ごとに自動実行 (UTC表記: JSTから9時間引いた時刻)
    - cron: '*/15 * * * *'
  workflow_dispatch: # 手動実行用ボタン

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 line-bot-sdk

      - name: Run Trout Island Bot
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python trout_bot.py

      - name: Commit and push DB changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update products.db [skip ci]" && git push)
