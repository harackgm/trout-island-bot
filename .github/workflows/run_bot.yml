name: Trout Island Watcher

on:
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Trout Island Bot
      env:
        LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        LINE_USER_ID: ${{ secrets.LINE_USER_ID }} # ← この行がPythonへの橋渡し役になります
      run: python trout_bot.py

    - name: Commit and push DB changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add products.db
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update DB" && git push)
